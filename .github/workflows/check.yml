name: checks
on:
  pull_request:
    # Only run workflow on file changes related to this check
    paths:
      - 'docs/keps/**/*.md'
      - 'dev/tools/update-toc'
      - 'dev/tools/verify-toc'
      - 'dev/tools/.notableofcontents'
      - 'Makefile'
      - '.github/workflows/check.yml'
  push:
    branches:
      - 'release-*'
      - 'master'
      - 'main'
    tags:
      - 'v*'
# To cancel running workflow when new commits pushed in a pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toc-update:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
    name: Generate and format
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        use-policy-store: true
        egress-policy: audit
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make toc-update && git diff --exit-code
